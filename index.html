<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Coffee Match — The Miners</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Coffee Match">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="preload" href="assets/fonts/NeueHaasDisplayBlack.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/NeueHaasDisplayMedium.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame">
    <header class="top">
      <button class="brand" id="brand" type="button" aria-label="The Miners">
        <img src="assets/icons/logo.svg" alt="" width="40" height="32">
        <span>Coffee Match</span>
      </button>
      <button class="btn btn-ghost btn-small" id="restart" type="button" hidden>Start over</button>
    </header>
    <main id="app" class="stage"></main>
  </div>

  <div class="overlay" id="idle" hidden>
    <div class="card overlay-card">
      <p class="eyebrow">Hello?</p>
      <h2 class="display">Still there?</h2>
      <p class="lead">We’ll start over in <b id="idle-count">10</b> seconds.</p>
      <div class="actions"><button class="btn btn-primary" id="idle-stay" type="button">Keep going</button></div>
    </div>
  </div>

  <div class="overlay" id="admin" hidden>
    <div class="card overlay-card admin">
      <p class="eyebrow">Staff only</p>
      <h2 class="display">What’s on the bar</h2>
      <p class="lead">Switch off what you don’t have today. Only products that are on will be recommended. Saved on this iPad.</p>
      <div class="admin-list" id="admin-list"></div>
      <div class="actions">
        <button class="btn btn-ghost" id="admin-all" type="button">All on</button>
        <button class="btn btn-primary" id="admin-close" type="button">Done</button>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="match.js"></script>
  <script src="app.js"></script>
</body>
</html>
